name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:   # 支持手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame-ce pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name Qixi_2026 Qixi_2026.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Qixi_2026-windows
          path: dist/Qixi_2026.exe
